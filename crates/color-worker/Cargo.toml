[package]
name = "color-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VGI worker bringing color-science (color-space conversions, CIEDE2000 ΔE, WCAG contrast) to DuckDB over Apache Arrow"

[[bin]]
name = "color-worker"
path = "src/main.rs"

[lib]
name = "color_worker"
path = "src/lib.rs"

[dependencies]
vgi.workspace = true
vgi-rpc.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
log = "0.4"
env_logger = "0.11"
